hazelcast:
  cluster-name: dev

  cp-subsystem:
    cp-member-count: 3
    group-size: 3
    session-heartbeat-interval-seconds: 5
    session-time-to-live-seconds: 60

  network:
    join:
      multicast:
        enabled: false
      tcp-ip:
        enabled: true
        member-list:
          - hz1
          - hz2
          - hz3
