# Task 2 - Distributed Lock Lab (Node.js)
# Structure similar to Lab2.docx, requirements from Task_2-DistributedLock.pdf

services:
  hz1:
    image: hazelcast/hazelcast:5.4.0
    container_name: hz1
    hostname: hz1
    command: ["hz", "start", "--config", "/opt/hazelcast/config/hazelcast.yaml"]
    volumes:
      - ./hazelcast.yaml:/opt/hazelcast/config/hazelcast.yaml:ro
    ports:
      - "5701:5701"

  hz2:
    image: hazelcast/hazelcast:5.4.0
    container_name: hz2
    hostname: hz2
    command: ["hz", "start", "--config", "/opt/hazelcast/config/hazelcast.yaml"]
    volumes:
      - ./hazelcast.yaml:/opt/hazelcast/config/hazelcast.yaml:ro
    ports:
      - "5702:5701"
    depends_on:
      - hz1

  hz3:
    image: hazelcast/hazelcast:5.4.0
    container_name: hz3
    hostname: hz3
    command: ["hz", "start", "--config", "/opt/hazelcast/config/hazelcast.yaml"]
    volumes:
      - ./hazelcast.yaml:/opt/hazelcast/config/hazelcast.yaml:ro
    ports:
      - "5703:5701"
    depends_on:
      - hz1

  # Management Center - Part I: view key distribution
  management-center:
    image: hazelcast/management-center:5.4.0
    container_name: hz-mc
    environment:
      MC_DEFAULT_CLUSTER: dev
      MC_DEFAULT_CLUSTER_MEMBERS: hz1:5701,hz2:5701,hz3:5701
    ports:
      - "8080:8080"
    depends_on:
      - hz1

  app:
    image: node:20
    container_name: hz-client
    working_dir: /app
    volumes:
      - .:/app
    depends_on:
      - hz1
      - hz2
      - hz3
    command: ["sleep", "infinity"]
